name: Tinytide

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  BabyCore:
    path: Packages/BabyCore
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.6

targets:
  Tinytide:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: BabyCore
      - target: TinytideWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Tinytide
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Midnight AppIcon-Sunrise AppIcon-Mint AppIcon-Blossom
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tinytide
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja, ko, es, pt-BR, fr, de]
        # Matches the Today screen's background, with the app icon in the middle,
        # so opening the app doesn't flash a full screen of color.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPhone-only portrait app: opt out of iPad multitasking orientation requirements.
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [remote-notification]
        CKSharingSupported: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        NSAlarmKitUsageDescription: Tinytide rings when a feeding, nap or activity countdown you set is up.
        ITSAppUsesNonExemptEncryption: false
        AppGroupIdentifier: $(APP_GROUP_ID)
        CloudKitContainerIdentifier: $(CLOUDKIT_CONTAINER_ID)
        PrivacyPolicyURL: $(PRIVACY_POLICY_URL)
    entitlements:
      path: App/Tinytide.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [$(CLOUDKIT_CONTAINER_ID)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  TinytideWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: BabyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Widgets
        PRODUCT_NAME: TinytideWidgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Tinytide Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupIdentifier: $(APP_GROUP_ID)
        CloudKitContainerIdentifier: $(CLOUDKIT_CONTAINER_ID)
    entitlements:
      path: Widgets/TinytideWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  TinytideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TinytideTests
    dependencies:
      - target: Tinytide
      - package: BabyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Tests
        GENERATE_INFOPLIST_FILE: YES

  TinytideSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TinytideSnapshotTests
        excludes:
          - "__Snapshots__/**"
    dependencies:
      - target: Tinytide
      - package: BabyCore
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).SnapshotTests
        GENERATE_INFOPLIST_FILE: YES

  TinytideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/TinytideUITests
    dependencies:
      - target: Tinytide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tinytide

schemes:
  Tinytide:
    build:
      targets:
        Tinytide: all
        TinytideWidgets: all
    run:
      config: Debug
      # Local StoreKit testing for the tip jar; no App Store Connect setup needed in the simulator.
      storeKitConfiguration: Config/Tinytide.storekit
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Tinytide
      targets:
        - TinytideTests
        - package: BabyCore/BabyCoreTests
    archive:
      config: Release

  # Screenshot diff tests: scripts/snapshots.sh
  TinytideSnapshots:
    build:
      targets:
        Tinytide: all
    test:
      config: Debug
      targets:
        - TinytideSnapshotTests
      environmentVariables:
        TZ: UTC

  # App Store screenshots: bundle exec fastlane screenshots
  TinytideScreenshots:
    build:
      targets:
        Tinytide: all
    test:
      config: Debug
      targets:
        - TinytideUITests
