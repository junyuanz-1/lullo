name: Lullo

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  BabyCore:
    path: Packages/BabyCore

targets:
  Lullo:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: BabyCore
      - target: LulloWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Lullo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lullo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [remote-notification]
        CKSharingSupported: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        ITSAppUsesNonExemptEncryption: false
        AppGroupIdentifier: $(APP_GROUP_ID)
        CloudKitContainerIdentifier: $(CLOUDKIT_CONTAINER_ID)
    entitlements:
      path: App/Lullo.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [$(CLOUDKIT_CONTAINER_ID)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  LulloWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: BabyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Widgets
        PRODUCT_NAME: LulloWidgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Lullo Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupIdentifier: $(APP_GROUP_ID)
        CloudKitContainerIdentifier: $(CLOUDKIT_CONTAINER_ID)
    entitlements:
      path: Widgets/LulloWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  LulloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LulloTests
    dependencies:
      - target: Lullo
      - package: BabyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lullo:
    build:
      targets:
        Lullo: all
        LulloWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Lullo
      targets:
        - LulloTests
        - package: BabyCore/BabyCoreTests
    archive:
      config: Release
